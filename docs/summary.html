<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>aeo-app.ai — Your plan</title>
    <meta name="description" content="Everything we found, in the order you should tackle it." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b5bdb'/%3E%3Cpath d='M16 7l7 9-7 9-7-9z' fill='white'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="assets/style.css" />
    <script>
      try {
        var theme = localStorage.getItem("ploutos.theme") || "dark";
        document.documentElement.setAttribute("data-theme", theme === "light" ? "light" : "dark");
      } catch (e) {}
    </script>
  </head>
  <body data-page="summary">
    <div class="progress"><div class="progress-bar" data-progress></div></div>

    <header class="site-header">
      <a class="brand" href="index.html"
        ><span class="brand-mark">&#9670;</span> aeo-app.ai</a
      >
      <div class="header-right">
        <a class="domain-chip" data-domain-chip hidden title="Change website"
          ><span class="chip-dot"></span><span data-chip-text></span></a
        >
        <button class="icon-btn" type="button" data-theme-toggle aria-label="Switch between light and dark" title="Switch theme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2" /><path d="M12 2.6v2M12 19.4v2M2.6 12h2M19.4 12h2M5.4 5.4l1.4 1.4M17.2 17.2l1.4 1.4M18.6 5.4l-1.4 1.4M6.8 17.2l-1.4-1.4" /></svg>
        </button>
      </div>
    </header>

    <main class="page">
      <p class="eyebrow"><span data-step-label>Step 10 of 10</span></p>
      <h1>That&rsquo;s your plan</h1>
      <p class="lede">Everything we found, in the order we would tackle it.</p>

      <div class="card" style="margin-top: 28px">
        <form class="domain-form" data-domain-form novalidate style="margin-top: 0">
          <label class="field-label" for="domain">Your website</label>
          <div class="field-row">
            <input class="field" id="domain" name="domain" type="text" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false" placeholder="yourcompany.com" />
            <button class="btn btn-primary" type="submit">Update</button>
          </div>
          <p class="field-hint" data-domain-hint>Type just the name — we will fill in the rest.</p>
        </form>
      </div>

      <section class="results" data-results data-loading-text="putting your plan together" hidden></section>
    </main>

    <footer class="site-footer">
      <nav class="step-nav" data-step-nav aria-label="Steps"></nav>
      <p class="footer-note">Sample report — the numbers are examples, not a real audit.</p>
    </footer>

    <script src="assets/app.js"></script>
  </body>
</html>
