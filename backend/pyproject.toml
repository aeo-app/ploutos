[project]
name = "apac-seo-api"
version = "4.1.0"
description = "AI-powered SEO competitive intelligence, content strategy, and relocation social-media API — FastAPI + AWS Bedrock, gated behind Airwallex payment."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # Web framework
    "fastapi==0.115.0",
    "apscheduler==3.10.4",  # in-process background job for scheduled social posts — see main.py, services/social_publish/scheduler.py
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.12",  # required for FastAPI's UploadFile/File() — see routers/canva_router.py

    # Validation
    "pydantic==2.9.2",
    "python-dotenv==1.0.1",

    # AWS — single SDK for Bedrock, Cognito, DynamoDB
    "boto3==1.35.36",
    "botocore==1.35.36",

    # HTTP client for the Airwallex payment gateway API
    "requests==2.32.3",

    # JWT verification for Cognito tokens
    "PyJWT[crypto]==2.9.0",
    "cryptography==43.0.1",
]

[dependency-groups]
dev = [
    # For local integration testing against a mocked DynamoDB — see the
    # "Testing" section in README.md.
    "moto[dynamodb]>=5.0",
    "pytest>=8.0",
    "httpx>=0.27",  # required by fastapi.testclient.TestClient
]

[tool.uv]
package = false
